script: |
  set -e  # Para em qualquer erro
  
  # Configurar Git
  git config --global --add safe.directory /opt/projects/rivo
  
  # Ir para o diretório
  cd /opt/projects/rivo
  
  echo "📦 Diretório: $(pwd)"
  
  # Verificar se há alterações no docker-compose.yml
  if git status --porcelain docker-compose.yml | grep -q .; then
    echo "📝 Guardando alterações locais do docker-compose.yml"
    git stash push -m "config-vps-$(date +%Y%m%d-%H%M%S)" docker-compose.yml
  else
    echo "✅ Sem alterações locais no docker-compose.yml"
  fi
  
  # Puxar atualizações
  echo "⬇️  Puxando atualizações do repositório..."
  git pull origin main
  
  # Reaplicar configurações locais se existirem
  if git stash list | grep -q "config-vps"; then
    echo "🔄 Reaplicando configurações locais..."
    if git stash pop; then
      echo "✅ Configurações locais reaplicadas com sucesso"
    else
      echo "❌ Conflito no docker-compose.yml!"
      echo "Resolva o conflito manualmente na VPS:"
      echo "  cd /opt/projects/rivo"
      echo "  cat docker-compose.yml"
      exit 1
    fi
  fi
  
  # Fazer deploy
  echo "🐳 Subindo containers..."
  docker compose up -d --build
  
  # Limpar imagens antigas
  echo "🧹 Limpando imagens não utilizadas..."
  docker image prune -f
  
  # Health check
  echo "🏥 Aguardando aplicação ficar saudável..."
  for i in $(seq 1 30); do
    if docker run --rm --network proxy curlimages/curl:latest \
         -fsS http://rivo-api:8080/health > /dev/null 2>&1; then
      echo "✅ Saudável ao fim de ${i} tentativas."
      exit 0
    fi
    echo "⏳ Tentativa $i/30..."
    sleep 10
  done
  
  echo "❌ Aplicação não respondeu em 5 minutos."
  docker compose logs --tail 200 api
  exit 1