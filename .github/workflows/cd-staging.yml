name: CD staging

# Publica em staging o que entrar em `main`.
#
# Separado do CI de propósito. O CI responde "isto está correcto?" e bloqueia
# PRs; este responde "isto está a correr?" e não bloqueia nada — misturá-los
# faria uma falha de deployment parecer uma falha de código.
#
# Nunca dispara a partir de um PR: só de `main`, que é o ramo protegido e que
# já passou nos dois jobs de CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dois deployments em simultâneo aplicariam migrações concorrentes ao mesmo
# schema. Sem cancelamento — um deployment a meio não se interrompe.
concurrency:
  group: cd-staging
  cancel-in-progress: false

permissions:
  # Necessário para o OIDC: é este token que a identidade gerida troca por
  # acesso ao Azure. Não há segredo de longa duração guardado.
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-rivo-staging
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy:
    name: Publicar em staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - uses: actions/checkout@v7

      - name: Autenticar no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Os nomes dos recursos têm um sufixo derivado do id do grupo de
      # recursos — são estáveis mas não adivinháveis. Lê-los do deployment
      # evita repeti-los aqui e evita que divirjam do Bicep.
      - name: Ler os nomes dos recursos
        id: infra
        run: |
          set -euo pipefail
          saida=$(az deployment group show \
            --resource-group "$RESOURCE_GROUP" --name main \
            --query properties.outputs -o json)

          echo "registry=$(echo "$saida" | jq -r .registryName.value)" >> "$GITHUB_OUTPUT"
          echo "loginServer=$(echo "$saida" | jq -r .registryLoginServer.value)" >> "$GITHUB_OUTPUT"
          echo "apiName=$(echo "$saida" | jq -r .apiName.value)" >> "$GITHUB_OUTPUT"
          echo "apiUrl=$(echo "$saida" | jq -r .apiUrl.value)" >> "$GITHUB_OUTPUT"
          echo "vault=$(echo "$saida" | jq -r .vaultName.value)" >> "$GITHUB_OUTPUT"

      # A imagem é marcada com o SHA do commit, e não com `latest`. Assim
      # sabe-se sempre que código está a correr, e o rollback é reimplantar uma
      # marca anterior em vez de reconstruir.
      - name: Construir e publicar a imagem
        run: |
          set -euo pipefail
          az acr login --name "${{ steps.infra.outputs.registry }}"
          imagem="${{ steps.infra.outputs.loginServer }}/rivo-api:${{ github.sha }}"
          docker build -t "$imagem" .
          docker push "$imagem"

      # Migrações como passo próprio do pipeline, e não no arranque da
      # aplicação (ADR-020). No arranque, várias instâncias competiriam pelo
      # mesmo schema e uma migração destrutiva correria sem ninguém a aprovar.
      #
      # O bundle é um executável autónomo: aplica as migrações sem precisar do
      # SDK nem do código-fonte na máquina que o corre.
      - name: Instalar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Aplicar migrações
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"

          # `migrations bundle` compila o projecto, e compilar exige os assets
          # do NuGet. Sem restore, o primeiro módulo falha com NETSDK1004 e o
          # pipeline nunca chega a tocar na base de dados.
          dotnet restore Rivo.slnx

          ligacao=$(az keyvault secret show \
            --vault-name "${{ steps.infra.outputs.vault }}" \
            --name connection-string-rivo \
            --query value -o tsv)

          # Sem isto, a connection string aparece em claro se algum comando a
          # ecoar. Segredos lidos do Key Vault não são mascarados sozinhos —
          # só os que vêm de `secrets.*`.
          echo "::add-mask::$ligacao"

          # `migrations bundle` constrói o `DbContext` em tempo de desenho, e
          # para isso corre o registo de serviços da aplicação — que exige
          # connection string e chave de JWT ou recusa-se a arrancar.
          #
          # Aqui vão valores fictícios de propósito: a geração do bundle não
          # toca em base de dados nenhuma. A ligação real entra só na execução,
          # por `--connection`, e assim o segredo nunca passa pela compilação.
          export ConnectionStrings__Rivo="Host=localhost;Port=5432;Database=rivo;Username=build;Password=build"
          export Jwt__SigningKey="chave-ficticia-so-para-gerar-o-bundle-32+"
          export Jwt__Issuer="rivo-api"
          export Jwt__Audience="rivo-client"

          # Um bundle por módulo: cada um tem o seu `DbContext` e a sua tabela
          # de histórico, no seu próprio schema (ADR-020).
          #
          # `identity` vem por último — o seu seed atribui permissões
          # declaradas pelos outros, cujos schemas têm de existir primeiro.
          for modulo in Audit:AuditDbContext \
                        Documents:DocumentsDbContext \
                        Notifications:NotificationsDbContext \
                        Hr:HrDbContext \
                        Identity:RivoIdentityDbContext; do
            nome="${modulo%%:*}"
            contexto="${modulo##*:}"

            echo "::group::migrações de $nome"
            dotnet ef migrations bundle \
              --project "src/Modules/$nome/Rivo.$nome.Infrastructure" \
              --startup-project src/Rivo.Api \
              --context "$contexto" \
              --output "bundle-$nome" --force
            "./bundle-$nome" --connection "$ligacao"
            echo "::endgroup::"
          done

      - name: Publicar a imagem no App Service
        run: |
          set -euo pipefail
          az webapp config container set \
            --name "${{ steps.infra.outputs.apiName }}" \
            --resource-group "$RESOURCE_GROUP" \
            --container-image-name "${{ steps.infra.outputs.loginServer }}/rivo-api:${{ github.sha }}"

      # Sem isto, o job passa quando o `az` devolve, não quando a aplicação
      # está de pé — e um deployment que subiu uma imagem partida ficaria verde.
      - name: Esperar que responda
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "${{ steps.infra.outputs.apiUrl }}/health" > /dev/null 2>&1; then
              echo "Saudável ao fim de ${i} tentativas."
              curl -s "${{ steps.infra.outputs.apiUrl }}/health"
              exit 0
            fi
            sleep 10
          done
          echo "A aplicação não respondeu em 5 minutos."
          exit 1

      - name: Logs em caso de falha
        if: failure()
        run: |
          az webapp log tail \
            --name "${{ steps.infra.outputs.apiName }}" \
            --resource-group "$RESOURCE_GROUP" &
          sleep 30
          kill %1 || true
