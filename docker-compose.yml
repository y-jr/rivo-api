# Stack de execução: só a API.
#
# A base de dados é um SQL Server **externo**, que vive fora do Docker e fora
# desta máquina (ADR-029). Não há serviço de base de dados aqui de propósito:
# o compose descreve o que este deployment cria e destrói, e a base de dados
# não é nem uma coisa nem outra — sobrevive ao `docker compose down`.
#
# Para desenvolvimento local e para o CI, `docker-compose.dev.yml` acrescenta
# um SQL Server em container:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rivo-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080

      # Documentação da API (`/swagger` e `/openapi/v1.json`) — ADR-038.
      #
      # Por omissão fechada fora de desenvolvimento: expor a superfície poupa
      # trabalho de reconhecimento a quem ataca. Abre-se pondo
      # `EXPOSE_OPENAPI=true` no `.env` — **interruptor próprio, e não
      # `ASPNETCORE_ENVIRONMENT=Development`**, que traria atrás os cabeçalhos
      # reencaminhados desligados (K8) e a página de excepções com stack trace.
      OpenApi__Expose: ${EXPOSE_OPENAPI:-false}

      # Ligação ao SQL Server. Vem do .env, que não é versionado — ver
      # .env.example.
      ConnectionStrings__Rivo: ${CONNECTION_STRING:?defina CONNECTION_STRING no .env}

      # Migração no arranque (ADR-030). Neste deployment não há passo de
      # pipeline com acesso à base de dados: o CD faz `git pull` e sobe o
      # container, e mais nada. É este interruptor que aprova a migração.
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-true}

      # Quanto tempo a migração insiste enquanto o servidor não atende. Um
      # SQL Server frio demora dezenas de segundos a aceitar ligações, e o
      # container da API arranca em poucos. Esgotado o prazo, o arranque falha
      # com erro visível em vez de esperar para sempre.
      Database__StartupTimeoutSeconds: ${DATABASE_STARTUP_TIMEOUT_SECONDS:-180}

      # Seed de perfis, permissões e utilizadores de arranque (ADR-028).
      # Idempotente: nunca altera contas existentes nem repõe passwords.
      # Depois do primeiro arranque de um ambiente pode passar a `false`.
      Bootstrap__SeedOnStartup: ${SEED_ON_STARTUP:-true}

      # Origens de browser autorizadas (ADR-033). Lista separada por vírgulas,
      # sem barra final — o browser compara a origem por igualdade textual.
      # Vazio significa que só um cliente no mesmo domínio consegue chamar.
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}

      # Tecto de pedidos nas três rotas públicas de `identity`, por endereço de
      # origem e por minuto. Segunda metade do travão à força bruta: o bloqueio
      # por tentativas fecha o ataque a uma conta, isto fecha o varrimento de
      # muitas.
      #
      # **O valor por omissão é o de produção.** `0` desliga, e é o que o
      # ambiente de verificação usa — as suites autenticam dezenas de vezes por
      # minuto a partir de um endereço só, que não é a forma de nenhum cliente
      # real.
      RateLimiting__AuthenticationPermitLimit: ${AUTH_RATE_LIMIT:-20}
      RateLimiting__AuthenticationWindowSeconds: ${AUTH_RATE_WINDOW_SECONDS:-60}

      # Onde vive o frontend. É para aqui que aponta a ligação do convite
      # (ADR-059) — não para a API. Sem isto, convidar devolve 501: mais vale
      # dizer que falta configuração do que enviar um convite que não abre.
      #
      # ⚠ **O `:-` põe a variável vazia, e uma variável de ambiente vazia
      # sobrepõe-se ao `appsettings.Development.json`.** Quem correr isto sem
      # `FRONTEND_BASE_URL` no `.env` tem 501 mesmo em desenvolvimento, e o valor
      # que está no ficheiro nunca chega a ser lido. Foi o que fez falhar as 21
      # suites na CI antes de ela passar a escrevê-la no `.env` que gera.
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-}

      # Servidor de correio (ADR-059). Vazio deixa o canal de log a funcionar,
      # que é o estado de desenvolvimento — a fila e o worker são reais, só
      # não sai nada da máquina.
      #
      # A password é segredo: vive no .env da máquina, nunca aqui.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-465}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-Rivo}

      # Login com Google (ADR-032). Opcional: sem ClientId, o endpoint
      # /identity/login/google responde 501 e o resto da aplicação não muda.
      # Não é segredo — viaja no frontend — mas é ele que fixa a audiência
      # esperada do ID token, e é isso que impede aceitar um token emitido
      # para outra aplicação qualquer.
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}

      Jwt__Issuer: ${JWT_ISSUER:-rivo-api}
      Jwt__Audience: ${JWT_AUDIENCE:-rivo-client}
      Jwt__SessionLifetimeMinutes: ${JWT_SESSION_LIFETIME_MINUTES:-60}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?defina JWT_SIGNING_KEY no .env}

      # Utilizadores iniciais. Admin e decisor usam o mesmo mecanismo — são
      # apenas entradas diferentes da mesma lista, com perfis diferentes.
      Bootstrap__Users__0__Email: ${BOOTSTRAP_ADMIN_EMAIL:?defina BOOTSTRAP_ADMIN_EMAIL no .env}
      Bootstrap__Users__0__Password: ${BOOTSTRAP_ADMIN_PASSWORD:?defina BOOTSTRAP_ADMIN_PASSWORD no .env}
      Bootstrap__Users__0__Profiles__0: Admin

      Bootstrap__Users__1__Email: ${BOOTSTRAP_DECIDER_EMAIL:?defina BOOTSTRAP_DECIDER_EMAIL no .env}
      Bootstrap__Users__1__Password: ${BOOTSTRAP_DECIDER_PASSWORD:?defina BOOTSTRAP_DECIDER_PASSWORD no .env}
      Bootstrap__Users__1__Profiles__0: Finance

      # Conta de operação, nunca de negócio (ADR-058). Resolve o arranque
      # circular de BR-20: o primeiro Cargo com autoridade de aprovação não
      # tem quem o aprove. Não se atribui a ninguém da empresa — só esta
      # conta tem `hr.positions.assign_direct`.
      #
      # **Opcional, e é deliberado** (`:-` e não `:?`, ao contrário das duas
      # de cima). Um ambiente que não a queira — o `.env` efémero do CI, uma
      # máquina já povoada — arranca na mesma: vazio significa não semear
      # ninguém, e o `BootstrapUserSeeder` salta a entrada. Exigi-las aqui
      # partia todo o `.env` escrito antes desta linha existir.
      Bootstrap__Users__2__Email: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      Bootstrap__Users__2__Password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
      Bootstrap__Users__2__Profiles__0: SuperAdmin

      # Raiz do armazenamento de documentos, num volume. Sem serviço de
      # objectos nesta fase — trocar por S3 ou Blob Storage é implementar
      # IDocumentStorage.
      DocumentStorage__RootPath: /var/rivo/documents

      NotificationDelivery__PollIntervalSeconds: ${NOTIFICATION_POLL_INTERVAL_SECONDS:-10}

      # Reconciliação de atribuições de cargo aprovadas (ADR-034). `approval`
      # não pode empurrar a decisão, por isso `hr` pergunta em ciclo. Desligar
      # obriga a aplicar cada decisão pelo endpoint, à mão.
      PositionApprovalReconciliation__Enabled: ${POSITION_APPROVAL_RECONCILIATION_ENABLED:-true}
      PositionApprovalReconciliation__PollIntervalSeconds: ${POSITION_APPROVAL_RECONCILIATION_INTERVAL_SECONDS:-60}

      # Facturacao (ADR-036). A mencao de nao-validade fiscal e congelada em
      # cada factura emitida: esvaziar aqui so afecta as seguintes.
      Finance__DefaultSeries: ${FINANCE_DEFAULT_SERIES:-S001}
      Finance__SeedDefaultSeries: ${FINANCE_SEED_DEFAULT_SERIES:-true}
      # A omissao e a mencao, nao o vazio: vazio significa "sistema
      # certificado", e nenhum ambiente o e. Um ambiente que esqueca esta
      # variavel tem de sair com a mencao, nao sem ela.
      Finance__FiscalNotice: ${FINANCE_FISCAL_NOTICE:-Documento sem validade fiscal - software nao certificado pela AGT.}
      Finance__FinalConsumerTaxId: ${FINANCE_FINAL_CONSUMER_TAX_ID:-CONSUMIDORFINAL}
      Finance__FinalConsumerName: ${FINANCE_FINAL_CONSUMER_NAME:-Consumidor final}
    volumes:
      # Anexos carregados. Sem este volume, um `docker compose down` leva os
      # ficheiros e deixa as linhas em `documents.document` a apontar para o
      # vazio.
      - rivo-documents-data:/var/rivo/documents
    expose:
      - "8080"
    networks:
      - proxy

volumes:
  rivo-documents-data:

# Rede partilhada com o reverse proxy da VPS, criada fora deste ficheiro:
#
#   docker network create proxy
#
# A API não publica porto nenhum no host: o único caminho até ela é o proxy.
# É disso que depende a confiança em `X-Forwarded-For` (ver Program.cs).
networks:
  proxy:
    external: true
